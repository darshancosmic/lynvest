<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Obsidian to Navy -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Emblem Primary Gradient: Electric Emerald to Cyan to Sky Blue -->
    <linearGradient id="emblem-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Shadow for Squircle -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bg-grad)" filter="url(#card-shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Subtle Internal Grid Ambient Lines (Symbolizing Ledger / Market Charts) -->
  <g opacity="0.1" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,6">
    <line x1="90" y1="180" x2="422" y2="180" />
    <line x1="90" y1="260" x2="422" y2="260" />
    <line x1="90" y1="340" x2="422" y2="340" />
  </g>

  <!-- Glowing Ascending Growth Aura -->
  <path d="M 120 350 L 210 270 L 290 310 L 392 165" 
        fill="none" 
        stroke="url(#emblem-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.3" 
        filter="url(#glow)" />

  <!-- Bold Minimalist 'L' Ascending Investment Emblem -->
  <!-- Vertical stem of the 'L' that roots the foundation (Capital/Ledger) -->
  <path d="M 120 160 C 120 148 130 138 142 138 C 154 138 164 148 164 160 L 164 330 C 164 345 175 356 190 356 L 360 356 C 372 356 382 366 382 378 C 382 390 372 400 360 400 L 170 400 C 142 400 120 378 120 350 Z" 
        fill="url(#accent-grad)" />

  <!-- Dynamic Upward Vector: Cutting across like an ascending stock/growth vector -->
  <path d="M 175 335 L 245 255 C 251 248 261 248 267 254 L 305 288 C 311 294 321 293 327 286 L 388 200" 
        fill="none" 
        stroke="url(#emblem-grad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Arrowhead / Peak Crest at top right -->
  <path d="M 345 185 L 398 185 C 404 185 409 190 409 196 L 409 248" 
        fill="none" 
        stroke="url(#emblem-grad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Peak Wealth Star / Investment Node -->
  <circle cx="395" cy="195" r="14" fill="#FFFFFF" />
</svg>
