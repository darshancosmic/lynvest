<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Purple Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Coin Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Royal Purple Inner Face -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="60%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square App Tile in Royal Purple -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.5" filter="url(#dropGlow)" />

  <!-- Subtle Pattern / Accent lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Central Coin / Shield Badge -->
  <g filter="url(#badgeShadow)">
    <!-- Golden Outer Coin Ring -->
    <circle cx="256" cy="256" r="156" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" />
    <!-- Inner Deep Royal Purple Face -->
    <circle cx="256" cy="256" r="138" fill="url(#innerGrad)" stroke="#3b0764" stroke-width="3" />
  </g>

  <!-- Rupee Symbol + Ledger Bars in crisp modern white / gold -->
  <g fill="#ffffff" transform="translate(18, 14)">
    <!-- Top bar 1 -->
    <rect x="200" y="166" width="104" height="18" rx="9" />
    <!-- Top bar 2 -->
    <rect x="200" y="202" width="94" height="18" rx="9" />
    <!-- Upper vertical stem -->
    <rect x="200" y="166" width="22" height="130" rx="9" />
    <!-- Curved loop -->
    <path d="M 220 166 C 290 166, 290 240, 220 240 Z" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <!-- Downward diagonal leg -->
    <line x1="228" y1="236" x2="288" y2="308" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Financial Uptrend Accent (Arrow) in Golden Yellow -->
  <g transform="translate(320, 150)">
    <path d="M 0 35 L 25 10 L 15 10 L 15 0 L 35 0 L 35 20 L 25 20 L 25 10 Z" fill="#fef08a" filter="url(#badgeShadow)" />
  </g>
</svg>
