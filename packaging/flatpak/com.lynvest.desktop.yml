app-id: com.lynvest.desktop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: lynvest

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-data/com.lynvest.desktop:create

modules:
  - name: lynvest
    buildsystem: simple
    build-commands:
      - install -Dm755 lynvest /app/bin/lynvest
      - install -Dm644 com.lynvest.desktop.desktop /app/share/applications/com.lynvest.desktop.desktop
      - install -Dm644 com.lynvest.desktop.metainfo.xml /app/share/metainfo/com.lynvest.desktop.metainfo.xml
      - install -Dm644 lynvest.svg /app/share/icons/hicolor/scalable/apps/com.lynvest.desktop.svg
      - install -Dm644 lynvest.png /app/share/icons/hicolor/512x512/apps/com.lynvest.desktop.png
    sources:
      - type: archive
        url: https://github.com/darshancosmic/lynvest/releases/download/v0.1.0/lynvest-0.1.0-linux-x86_64.tar.gz
        sha256: 6f58bf7964d8199c086f118adfe400f9401196701fd7b7b51919b1bda8a55dbc
      - type: file
        path: com.lynvest.desktop.desktop
      - type: file
        path: com.lynvest.desktop.metainfo.xml
      - type: file
        path: lynvest.svg
      - type: file
        path: lynvest.png
